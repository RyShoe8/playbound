name: Recipe health

# Every install PlayBound offers points at somewhere we do not control. This
# resolves all of them against their real upstreams and commits the result, so
# game pages can show how fresh the last check was and hide one-click buttons
# for recipes that are currently broken.
on:
  schedule:
    # 05:20 UTC daily — off the hour, since upstream release tooling tends to
    # publish on it and we would rather not read a half-published release.
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: recipe-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci --ignore-scripts

      - name: Check recipes
        working-directory: platform
        env:
          # Lifts the 60/hour anonymous GitHub limit. The checker falls back to
          # anonymous requests if this is ever rejected, so a bad token
          # degrades coverage rather than silently blanking the run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/check-recipe-health.ts

      - name: Commit results
        run: |
          if git diff --quiet -- platform/src/lib/data/recipeHealth.json; then
            echo "No change in recipe health."
            exit 0
          fi
          git config user.name "playbound-bot"
          git config user.email "bot@playbound.club"
          git add platform/src/lib/data/recipeHealth.json
          git commit -m "chore: update recipe health results"
          git push

      # Surfaces breakage where someone will see it. Deliberately after the
      # commit so the recorded result lands even when this step fails the run.
      - name: Fail if any recipe is broken
        working-directory: platform
        run: |
          broken=$(node -e "console.log(require('./src/lib/data/recipeHealth.json').broken)")
          echo "Broken recipes: $broken"
          if [ "$broken" -gt 0 ]; then
            node -e "
              const r = require('./src/lib/data/recipeHealth.json');
              for (const f of r.failures) console.log(\`::error::\${f.id} — \${f.detail}\`);
            "
            exit 1
          fi
