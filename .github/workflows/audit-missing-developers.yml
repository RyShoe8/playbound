name: Audit missing developers

on:
  push:
    branches: [main]
    paths:
      - platform/scripts/audit-missing-developers.ts

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: List only the named game and developer records
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npx tsx scripts/audit-missing-developers.ts
