name: Seed referenced developers

on:
  push:
    branches: [main]
    paths:
      - platform/src/lib/data/developers.ts

jobs:
  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Insert only the 20 missing developer profiles
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [[ ! "$MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo 'MONGODB_URI secret is not configured' >&2
            exit 1
          fi
          npm run seed:developers -- --slugs=microsoft-game-studios,maxis,missingseven,lobby,robinson-technologies,opensc2k,star-gem-inc,ruairi-dx,lefto-studio,playus-soft,depmify,556-games,neognosis,strategy-first,realm667,sake906,impressions-games,rallysimfans,simon-willison,mozetech
      - name: Verify scoped references
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npx tsx scripts/audit-missing-developers.ts
