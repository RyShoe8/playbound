name: Build macOS Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/build-macos.yml"
      - "platform/scripts/upload-launcher.ts"
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Skip if this version is already published
        id: check
        # See build-linux.yml for the full story: electron-builder output is
        # not byte-reproducible, so rebuilding an unchanged version and
        # republishing it under the same latest-mac.yml URL breaks any
        # electron-updater that fetched the manifest or started downloading
        # against an earlier run's bits. Only rebuild on a real version bump.
        run: |
          LOCAL_VERSION=$(node -p "require('./launcher/package.json').version")
          LIVE_VERSION=$(curl -fsSL "https://mt8u2b96lweefbpb.public.blob.vercel-storage.com/launcher/latest-mac.yml" | grep '^version:' | awk '{print $2}' || echo "")
          echo "local=$LOCAL_VERSION live=$LIVE_VERSION"
          if [ "$LOCAL_VERSION" = "$LIVE_VERSION" ]; then
            echo "Version $LOCAL_VERSION is already published — skipping rebuild."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Platform Dependencies
        if: steps.check.outputs.should_build == 'true'
        run: npm install
        working-directory: platform

      - name: Install Launcher Dependencies
        if: steps.check.outputs.should_build == 'true'
        run: npm install
        working-directory: launcher

      - name: Build macOS Launcher
        if: steps.check.outputs.should_build == 'true'
        run: npm run dist:mac
        working-directory: launcher

      - name: Upload to Vercel Blob
        if: steps.check.outputs.should_build == 'true'
        run: npm run upload:launcher -- --mac --promote-prod
        working-directory: platform
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN || vars.BLOB_READ_WRITE_TOKEN }}
