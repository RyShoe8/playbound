name: Build macOS Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install Platform Dependencies
        run: npm install
        working-directory: platform
          
      - name: Install Launcher Dependencies
        run: npm install
        working-directory: launcher

      - name: Build macOS Launcher
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK; fi
          if [ -z "$CSC_KEY_PASSWORD" ]; then unset CSC_KEY_PASSWORD; fi
          npm run dist:mac
        working-directory: launcher
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          
      - name: Upload to Vercel Blob
        run: npm run upload:launcher -- --mac
        working-directory: platform
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
