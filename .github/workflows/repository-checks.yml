name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  launcher:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: launcher-smoke-failure
          path: launcher/test-results/

  game-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/game-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test 2>&1 | tee /tmp/game-host-tests.tap
        shell: bash -o pipefail {0}
      - if: failure()
        run: |
          grep -A8 -E '^ *not ok' /tmp/game-host-tests.tap | grep -E 'not ok|error:|location:' | head -30 | while IFS= read -r line; do echo "::error::$line"; done
      - run: python3 tools/customer_resources_test.py
      - run: python3 tools/customer_identities_test.py
      - run: sudo python3 tools/customer_runtime_test.py
      - run: sudo python3 tools/customer_native_engine_test.py
      - run: sudo python3 tools/customer_data_migration_test.py
      - run: sudo python3 nativePackageBoundary.test.py
      - run: python3 -m py_compile tools/customer-network-check.py
      - run: python3 tools/customer_network_test.py
