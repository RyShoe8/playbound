name: Test nightly planner (isolated DB)

# Runs the real Game Night planner against a throwaway database on the
# production cluster, then drops it. Production data is only read.
on:
  workflow_dispatch:
  # Also runs when the test or the planner changes, so a fresh run on the
  # current commit never depends on someone clicking Run workflow.
  push:
    branches: [main]
    paths:
      - platform/scripts/test-nightly-planner-isolated.ts
      - platform/src/lib/events/nightlySchedule.ts
      - .github/workflows/test-nightly-planner.yml

concurrency:
  group: nightly-planner-it
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Planner integration test
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npx tsx scripts/test-nightly-planner-isolated.ts
