# Catalog wave apply.
# Never runs seed:editions / seed:mods / seed:launcher-install / sync-single-game.
# Writes only allowlisted inserts plus named field patches from insert:catalog-wave.
#
# This is how allowlisted catalog changes reach production Mongo.
# Do not apply catalog waves from a local machine (no env pull, no vercel env run).

name: Apply catalog wave

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "platform/scripts/insert-catalog-wave.allowlist.ts"
      - "platform/scripts/insert-catalog-wave.ts"
      - "platform/scripts/migrate-cop-anomaly-to-stalker-anomaly.ts"
      - "platform/src/lib/data/games.ts"
      - "platform/src/lib/data/editions.ts"
      - "platform/src/lib/data/editorial.ts"
      - "platform/src/lib/data/catalogCorrections.ts"
      - "platform/src/lib/data/developers.ts"
      - "platform/src/lib/data/teeworldsCatalog.ts"
      - "platform/src/lib/data/mods.ts"
      - ".github/workflows/apply-catalog-wave.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Mongo URI
        id: check_mongo
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [[ ! "$MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo "MONGODB_URI secret is not configured in GitHub Repository Settings (Settings → Secrets and variables → Actions)."
            echo "Skipping catalog wave apply."
            echo "has_mongo=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_mongo=true" >> $GITHUB_OUTPUT

      - name: Install Platform Dependencies
        if: steps.check_mongo.outputs.has_mongo == 'true'
        run: npm install

      - name: Seed new developers (insert-only, preserves existing)
        if: steps.check_mongo.outputs.has_mongo == 'true'
        run: npm run seed:developers
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Insert / field-patch allowlisted catalog rows
        if: steps.check_mongo.outputs.has_mongo == 'true'
        run: npm run insert:catalog-wave
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Migrate CoP anomaly library/party rows to stalker-anomaly
        if: steps.check_mongo.outputs.has_mongo == 'true'
        run: npm run migrate:cop-anomaly-to-stalker-anomaly:apply
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: "Sync Ashes and ET: Legacy recipes"
        if: steps.check_mongo.outputs.has_mongo == 'true'
        run: npm run sync:edition-install -- freedoom/ashes-2063 wolfenstein-enemy-territory/et-legacy
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Patch Combined Arms, VoxeLibre, and DREAM download fields
        if: steps.check_mongo.outputs.has_mongo == 'true'
        run: npm run patch:named-mods -- openra-combined-arms luanti-voxelibre dfu-dream
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
