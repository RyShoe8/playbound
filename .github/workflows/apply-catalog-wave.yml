# A catalog wave exists only while catalog-wave.pending.json contains a
# reviewed, exact-field patch. The successful job commits the empty file.
name: Apply catalog wave

on:
  push:
    branches: [main]
    paths:
      - "platform/scripts/catalog-wave.pending.json"

permissions:
  contents: write

concurrency:
  group: catalog-wave-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Validate exact targets and expected values
        run: npm run insert:catalog-wave -- --check
      - name: Apply only the reviewed pending operations
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run insert:catalog-wave -- --apply
      - name: Clear the applied wave
        run: |
          printf '{\n  "id": null,\n  "operations": []\n}\n' > scripts/catalog-wave.pending.json
          git add scripts/catalog-wave.pending.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='playbound-catalog-wave[bot]' \
              -c user.email='playbound-catalog-wave@users.noreply.github.com' \
              commit -m 'Clear applied catalog wave [skip ci]'
          git push origin HEAD:main
