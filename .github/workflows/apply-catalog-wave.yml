# Explicit, scoped catalog corrections only. A normal push must never rewrite
# curated Mongo rows from seed data. No local credential pulls.

name: Apply catalog wave

on:
  workflow_dispatch:
    inputs:
      media_only:
        description: "Apply only the reviewed broken-store-media URL replacements"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "platform/scripts/insert-catalog-wave.allowlist.ts"
      - "platform/scripts/insert-catalog-wave.ts"
      - "platform/scripts/migrate-cop-anomaly-to-stalker-anomaly.ts"
      - "platform/src/lib/data/games.ts"
      - "platform/src/lib/data/editions.ts"
      - "platform/src/lib/data/editorial.ts"
      - "platform/src/lib/data/catalogCorrections.ts"
      - "platform/src/lib/data/catalogEditionCorrections.ts"
      - "platform/src/lib/data/dedicatedDraftEditorial.ts"
      - "platform/src/lib/data/dedicatedDraftRequirements.ts"
      - "platform/src/lib/data/developers.ts"
      - "platform/scripts/seed-developers.ts"
      - "platform/src/lib/data/teeworldsCatalog.ts"
      - "platform/src/lib/data/mods.ts"
      - ".github/workflows/apply-catalog-wave.yml"

jobs:
  apply-soldier-of-fortune:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-scope:soldier-of-fortune]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Mongo URI
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [[ ! "$MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo "MONGODB_URI is not configured; no catalog rows were changed."
            exit 1
          fi
      - name: Install Platform Dependencies
        run: npm ci
      - name: Update Soldier of Fortune fields only
        run: npm run insert:catalog-wave -- --games=soldier-of-fortune-platinum-edition --fields=tagline,description,developerSlug,developerName,releaseYear,sizeMB,genres,platforms,launchMethods,browserPlayable,hasControllerSupport,maxPlayers,qualityBar,thatOneThing,longDescription,whyWePickedIt,bestFor,notFor,comparableTo,faq,installSteps,multiplayerGamingSteps,launcherInstall,systemRequirements,hardwareRequirements
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - name: Add multiplayer feature labels without replacing existing ones
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          for feature in Singleplayer Multiplayer "LAN Support"; do
            npm run insert:catalog-wave -- --games=soldier-of-fortune-platinum-edition --features-only "--feature=$feature"
          done

  apply-media-only:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.media_only == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-scope:store-media]')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Mongo URI
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [[ ! "$MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo "MONGODB_URI is not configured; no catalog rows were changed."
            exit 1
          fi
      - name: Install Platform Dependencies
        run: npm ci
      - name: Validate media replacements without writes
        run: npm run insert:catalog-wave -- --media-repairs-only --dry-run
      - name: Apply only named image and video replacements
        run: npm run insert:catalog-wave -- --media-repairs-only
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  apply-dedicated-drafts:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-scope:dedicated-drafts]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Mongo URI
        id: check_mongo
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [[ ! "$MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo "MONGODB_URI is not configured; no catalog rows were changed."
            exit 1
          fi
      - name: Install Platform Dependencies
        run: npm ci
      - name: Patch only the fifteen named draft games
        run: npm run insert:catalog-wave -- --games=battlefield-1942-anthology,counter-strike-source,factorio,necesse,dont-starve-together,barotrauma,stardew-valley,aneurism-iv,risk-of-rain-2,starbound,terraria,vintage-story,core-keeper,rimworld,unturned --fields=installSteps,systemRequirements,hardwareRequirements
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  apply-four-games:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-scope:four-games]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Mongo URI
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [[ ! "$MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo "MONGODB_URI is not configured; no catalog rows were changed."
            exit 1
          fi
      - name: Install Platform Dependencies
        run: npm ci
      - name: Correct only Unturned and ANEURISM IV store handoffs
        run: npm run insert:catalog-wave -- --games=unturned,aneurism-iv --fields=launcherInstall.url,launcherInstall.steamAppId
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - name: Correct only ANEURISM IV platform install steps
        run: npm run insert:catalog-wave -- --games=aneurism-iv --fields=installSteps
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - name: Correct only RimWorld controller status and executable pickup
        run: npm run insert:catalog-wave -- --games=rimworld --fields=hasControllerSupport,launcherInstall.exeHint
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
      - name: Correct only RimWorld Together edition install fields
        run: npm run insert:catalog-wave -- --editions=rimworld/rimworld-together
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  apply-battlefield-features:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-scope:battlefield-features]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Mongo URI
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [[ ! "$MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo "MONGODB_URI is not configured; no catalog rows were changed."
            exit 1
          fi
      - name: Install Platform Dependencies
        run: npm ci
      - name: Add only Battlefield 1942 dedicated-server feature
        run: npm run insert:catalog-wave -- --games=battlefield-1942-anthology --features-only "--feature=Dedicated Servers"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  apply-hyperdisc-install:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-scope:hyperdisc-install]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Mongo URI
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [[ ! "$MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo "MONGODB_URI is not configured; no catalog rows were changed."
            exit 1
          fi
      - name: Install Platform Dependencies
        run: npm ci
      - name: Wire only HyperDisc Arena desktop installs
        run: npm run insert:catalog-wave -- --games=hyperdisc-arena --fields=platforms,launchMethods,launcherInstall
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  apply-grid-leader:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-scope:grid-leader]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Mongo URI
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [[ ! "$MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo "MONGODB_URI is not configured; no catalog rows were changed."
            exit 1
          fi
      - name: Install Platform Dependencies
        run: npm ci
      - name: Update only Grid Leader's install recipe and steps
        run: npm run insert:catalog-wave -- --games=grid-leader --fields=launcherInstall,installSteps
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  apply-skylance:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-scope:skylance]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Mongo URI
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [[ ! "$MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo "MONGODB_URI is not configured; no catalog rows were changed."
            exit 1
          fi
      - name: Install Platform Dependencies
        run: npm ci
      - name: Update only Skylance install fields
        run: npm run insert:catalog-wave -- --games=skylance --fields=launchMethods,hasControllerSupport,sizeMB,installSteps,launcherInstall
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

  apply-wings-of-dawn:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-scope:wings-of-dawn]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Mongo URI
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [[ ! "$MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo "MONGODB_URI is not configured; no catalog rows were changed."
            exit 1
          fi
      - name: Install Platform Dependencies
        run: npm ci
      - name: Update Wings of Dawn fields only
        run: npm run insert:catalog-wave -- --games=wings-of-dawn --fields=thatOneThing,platforms
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
