<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: http:; media-src 'self' https: http:" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>PlayBound</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <nav id="sidebar">
        <div class="sidebar-brand">
          <span class="logo-mark">▶</span>
          <span class="brand-text">Play<em>Bound</em></span>
        </div>
        <div class="sidebar-nav">
          <button class="nav-btn active" data-view="home">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home
          </button>
          <button class="nav-btn" data-view="games">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
            Games
          </button>
          <button class="nav-btn" data-view="mods">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19.439 7.85c.192.168.2.3.06.884l-5.69 9.86a.752.752 0 01-1.313.02l-2.82-4.76-4.76-2.82a.751.751 0 01.02-1.313l9.86-5.69a.75.75 0 01.884.06l3.76 3.76z"/><path d="M7 17l-3 3"/><path d="M14 7l3-3"/></svg>
            Mods
          </button>
          <button class="nav-btn" data-view="servers">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1"/><circle cx="6" cy="18" r="1"/></svg>
            Servers
          </button>
          <button class="nav-btn" data-view="events">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Events
          </button>
          <button class="nav-btn" data-view="library">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
            Library
          </button>
          <button class="nav-btn" data-view="friends">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            Friends
          </button>
        </div>
        <div class="sidebar-bottom">
          <a
            href="https://discord.gg/yc7WdxATar"
            class="sidebar-discord"
            id="sidebar-discord"
          >
            <span class="sidebar-discord-title">Join the Discord</span>
            <span class="sidebar-discord-blurb"
              >Hang with the community, find people to play with, and hear about new games.</span
            >
            <span class="sidebar-discord-cta">Open Discord</span>
          </a>
          <div class="sidebar-compat" id="sidebar-compat">
            <p class="sidebar-compat-label">Games for this PC</p>
            <div class="sidebar-compat-options">
              <label class="sidebar-compat-opt">
                <input type="radio" name="compat-filter" value="compatible" checked />
                Compatible
              </label>
              <label class="sidebar-compat-opt">
                <input type="radio" name="compat-filter" value="all" />
                All Games
              </label>
            </div>
          </div>
          <button class="nav-btn" data-view="settings">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            Settings
          </button>
          <div class="sidebar-status">
            <span id="connection-dot" class="dot"></span>
            <span id="connection-label">Offline</span>
          </div>
        </div>
      </nav>

      <!-- Main Content -->
      <main id="content">
        <div id="view-home" class="view active"></div>
        <div id="view-games" class="view"></div>
        <div id="view-mods" class="view"></div>
        <div id="view-servers" class="view"></div>
        <div id="view-events" class="view"></div>
        <div id="view-library" class="view"></div>
        <div id="view-friends" class="view"></div>
        <div id="view-settings" class="view"></div>
        <div id="view-game-detail" class="view"></div>
        <div id="view-edition-detail" class="view"></div>
        <div id="view-deep-link" class="view"></div>
      </main>

      <!-- Status Bar -->
      <footer id="statusbar">
        <div id="statusbar-msg"></div>
        <div id="statusbar-progress" class="hidden">
          <div id="statusbar-bar"></div>
        </div>
      </footer>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
